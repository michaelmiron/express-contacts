<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Menu</title>
  <link rel="stylesheet" href="../styles/menu.css" />
</head>
<body>
  <div class="container">
    <h2>Welcome to the Menu</h2>
    
    <div class="search-section">
      <input type="text" id="searchInput" placeholder="Search contacts by name or email..." />
      <button id="searchBtn">Search</button>
      <button id="clearBtn">Show All</button>
    </div>

    <div id="contactsList" class="contacts-list"></div>

    <a class="menu-link" href="create-contact.html">Create Contact</a>
    <button id="logoutBtn">Logout</button>
  </div>
  <script>
    if (!localStorage.getItem("token")) {
      window.location.href = "login.html";
    }

    let allContacts = [];

    async function loadContacts() {
      const token = localStorage.getItem("token");
      const response = await fetch("/api/contacts", {
        headers: { "Authorization": "Bearer " + token }
      });
      if (response.ok) {
        allContacts = await response.json();
        displayContacts(allContacts);
      }
    }

    function displayContacts(contacts) {
      const contactsList = document.getElementById("contactsList");
      if (contacts.length === 0) {
        contactsList.innerHTML = "<p>No contacts found.</p>";
        return;
      }
      
      contactsList.innerHTML = contacts.map(contact => `
        <div class="contact-item">
          <div class="contact-info">
            <strong>${contact.name}</strong><br>
            Email: ${contact.email}<br>
            Phone: ${contact.phone}
          </div>
          <div class="contact-actions">
            <button onclick="editContact('${contact._id}')" class="edit-btn">Edit</button>
            <button onclick="deleteContact('${contact._id}')" class="delete-btn">Delete</button>
          </div>
        </div>
      `).join("");
    }

    async function deleteContact(contactId) {
      if (!confirm("Are you sure you want to delete this contact?")) return;
      
      const token = localStorage.getItem("token");
      const response = await fetch(`/api/contacts/${contactId}`, {
        method: "DELETE",
        headers: { "Authorization": "Bearer " + token }
      });
      
      if (response.ok) {
        alert("Contact deleted successfully!");
        loadContacts();
      } else {
        alert("Error deleting contact");
      }
    }

    function editContact(contactId) {
      const contact = allContacts.find(c => c._id === contactId);
      const newName = prompt("Enter new name:", contact.name);
      const newEmail = prompt("Enter new email:", contact.email);
      const newPhone = prompt("Enter new phone:", contact.phone);
      
      if (newName && newEmail && newPhone) {
        updateContact(contactId, { name: newName, email: newEmail, phone: newPhone });
      }
    }

    async function updateContact(contactId, data) {
      const token = localStorage.getItem("token");
      const response = await fetch(`/api/contacts/${contactId}`, {
        method: "PUT",
        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer " + token
        },
        body: JSON.stringify(data)
      });
      
      if (response.ok) {
        alert("Contact updated successfully!");
        loadContacts();
      } else {
        alert("Error updating contact");
      }
    }

    function filterContacts(searchTerm) {
      const filtered = allContacts.filter(contact => 
        contact.name.toLowerCase().includes(searchTerm.toLowerCase()) ||
        contact.email.toLowerCase().includes(searchTerm.toLowerCase())
      );
      displayContacts(filtered);
    }

    document.getElementById("searchBtn").onclick = function() {
      const searchTerm = document.getElementById("searchInput").value;
      filterContacts(searchTerm);
    };

    document.getElementById("clearBtn").onclick = function() {
      document.getElementById("searchInput").value = "";
      displayContacts(allContacts);
    };

    document.getElementById("searchInput").addEventListener("keyup", function(e) {
      if (e.key === "Enter") {
        filterContacts(this.value);
      }
    });

    document.getElementById("logoutBtn").onclick = function() {
      localStorage.removeItem("token");
      window.location.href = "login.html";
    };

    loadContacts();
  </script>
</body>
</html>
